name: Build Desktop App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Build Application
      run: dotnet publish ClientVisitManager.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o release/

    - name: Upload Executable
      uses: actions/upload-artifact@v3
      with:
        name: ExonicSalonApp
        path: release/name: Build Desktop App

